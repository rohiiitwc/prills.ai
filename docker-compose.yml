version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: prills_postgres
    restart: always
    environment:
      POSTGRES_USER: prills_user
      POSTGRES_PASSWORD: prills_secure_password
      POSTGRES_DB: prills_signals
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prills_user -d prills_signals"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: prills_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://prills_user:prills_secure_password@postgres:5432/prills_signals
      - TELEGRAM_API_ID=${TELEGRAM_API_ID:-0}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH:-}
      - TELEGRAM_PHONE_NUMBER=${TELEGRAM_PHONE_NUMBER:-}
      - TELEGRAM_SESSION_STRING=${TELEGRAM_SESSION_STRING:-}
      - DISPLAY_TIMEZONE=Asia/Kolkata
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: prills_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
